			<div class="card">
				<div class="card-header">基本資料</div>
			  <div class="card-body">
			  	<div class="row">
				<div class="form-group col-sm-4">
				    <label for="uname">姓名</label>
				    <input type="text" class="form-control" id="uname" aria-describedby="uname">
					<small id="uname" class="form-text text-muted">您的基本資料僅供本次旅遊使用</small>
				  </div>
				  <div class="form-group col-sm-4">
				    <label for="bdate">生日</label>
				    <input type="date" class="form-control" id="bdate">
				  </div>
				 <div class="form-group col-sm-4">
				 	<label for="gender">性別</label>
				 	<div class="form-check">
					  <input class="form-check-input" type="radio" name="gender" id="male" value="1" checked>
					  <label class="form-check-label" for="exampleRadios1">
					    男
					  </label>
					</div>
					<div class="form-check">
					  <input class="form-check-input" type="radio" name="exampleRadios" id="female" value="2">
					  <label class="form-check-label" for="exampleRadios2">
					    女
					  </label>
						</div>
				 	</div>
				</div>
					<div class="row">
						<div class="form-group col-sm-4">
						    <label for="mobile">手機</label>
						    <input type="text" class="form-control" id="mobile" aria-describedby="mobile">
						  </div>
						  <div class="form-group col-sm-4">
						    <label for="exampleInputPassword1">家裡電話</label>
						    <input type="text" class="form-control" id="homephone">
						  </div>
						 <div class="form-group col-sm-4">
						    <label for="offiecephone">公司電話</label>
						    <input type="text" class="form-control" id="offiecephone">
						  </div>
					</div> 
					<div class="row">
						<div class="form-group col-sm-12">
						    <label for="address">住址</label>
						    <input type="text" class="form-control" id="address" aria-describedby="address">						    
						  </div>						  
					</div> 
			  	</div>
			</div>

			<div class="card">
				<div class="card-header">行程資料</div>
			  <div class="card-body">
			  	<div class="row">
				<div class="form-group col-sm-4">
				    <label for="startdate">想要得出發日區間~起</label>
				    <input type="date" class="form-control" id="startdate" aria-describedby="startdate">				    
				  </div>
				  <div class="form-group col-sm-4">
				    <label for="enddate">想要得出發日區間~迄</label>
				    <input type="date" class="form-control" id="enddate">
				  </div>
				<div class="form-group" col-sm-4>
					<label for="enddate">想要參加哪一團</label>
						<select class="form-control">
						  <option>超值吳哥窟五日-直飛</option>
						  <option>北海道薰衣草、函館小樽5日</option>
						  <option>峇里5日~動物園.大象晚餐</option>
						  <option>首爾-釜山雙城遊</option>
						</select>
						
				</div>
					<div class="row">
						<div class="form-group col-sm-12">
							<label for="enddate">可接受航班</label>
						    <div class="custom-control custom-checkbox custom-control-inline ml-3">
								  <input type="checkbox" class="custom-control-input" id="rgrb">
								  <label class="custom-control-label" for="rgrb">早出早回</label>
								</div>
								<div class="custom-control custom-checkbox custom-control-inline">
								  <input type="checkbox" class="custom-control-input" id="rgnb">
								  <label class="custom-control-label" for="rgnb">早出晚回</label>
								</div>
								<div class="custom-control custom-checkbox custom-control-inline">
								 <input type="checkbox" class="custom-control-input" id="rgrb">
								  <label class="custom-control-label" for="rgrb">晚出早回</label>
								</div>
								<div class="custom-control custom-checkbox custom-control-inline">
								  <input type="checkbox" class="custom-control-input" id="rgnb">
								  <label class="custom-control-label" for="rgnb">晚出晚回</label>
								</div>
						  </div>
					 
						  </div>
